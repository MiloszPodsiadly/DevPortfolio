<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Miłosz Podsiadły — Junior Software Developer</title>
  <desc id="description">Blue and violet personal portfolio cover with an MP monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D20" />
      <stop offset="0.6" stop-color="#0B1430" />
      <stop offset="1" stop-color="#111333" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8CFF" />
      <stop offset="0.55" stop-color="#9568F9" />
      <stop offset="1" stop-color="#B8A4FF" />
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#4E8CFF" stop-opacity="0.34" />
      <stop offset="1" stop-color="#4E8CFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#9568F9" stop-opacity="0.28" />
      <stop offset="1" stop-color="#9568F9" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path
        d="M 42 0 L 0 0 0 42"
        fill="none"
        stroke="#B8A4FF"
        stroke-opacity="0.055"
        stroke-width="1"
      />
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1035" cy="168" r="270" fill="url(#blueGlow)" filter="url(#blur)" />
  <circle cx="885" cy="496" r="260" fill="url(#violetGlow)" filter="url(#blur)" />
  <path
    d="M0 565 C250 500 410 640 690 575 S1040 485 1200 535"
    fill="none"
    stroke="url(#accent)"
    stroke-opacity="0.18"
    stroke-width="2"
  />
  <path
    d="M0 582 C260 517 430 656 705 592 S1035 505 1200 554"
    fill="none"
    stroke="#4E8CFF"
    stroke-opacity="0.1"
    stroke-width="1"
  />

  <g fill="#B8A4FF">
    <circle cx="751" cy="118" r="2" opacity="0.75" />
    <circle cx="706" cy="464" r="2.5" opacity="0.55" />
    <circle cx="1128" cy="427" r="2" opacity="0.8" />
    <circle cx="1083" cy="119" r="1.5" opacity="0.7" />
    <circle cx="680" cy="183" r="1.5" opacity="0.5" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="105" fill="#B8A4FF" font-size="16" font-weight="700" letter-spacing="4">
      PERSONAL PORTFOLIO
    </text>
    <path d="M88 130 H164" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" />
    <text x="84" y="268" fill="#F4F5FF" font-size="82" font-weight="700" letter-spacing="-2">
      Miłosz
    </text>
    <text x="84" y="362" fill="#F4F5FF" font-size="82" font-weight="700" letter-spacing="-2">
      Podsiadły
    </text>
    <rect x="88" y="406" width="5" height="37" rx="2.5" fill="url(#accent)" />
    <text x="112" y="433" fill="#D5D9F2" font-size="25" font-weight="500" letter-spacing="0.2">
      Junior Software Developer
    </text>
    <text x="88" y="536" fill="#9EA9CC" font-size="15" font-weight="600" letter-spacing="3">
      ENGLISH · POLSKI
    </text>
  </g>

  <g transform="translate(925 310)">
    <circle
      r="205"
      fill="#0A1028"
      fill-opacity="0.58"
      stroke="#B8A4FF"
      stroke-opacity="0.16"
      stroke-width="1"
    />
    <ellipse
      rx="145"
      ry="190"
      fill="none"
      stroke="url(#accent)"
      stroke-opacity="0.56"
      stroke-width="2"
      transform="rotate(-31)"
    />
    <ellipse
      rx="145"
      ry="190"
      fill="none"
      stroke="#4E8CFF"
      stroke-opacity="0.25"
      stroke-width="1"
      transform="rotate(39)"
    />
    <circle cx="-112" cy="-142" r="5" fill="#4E8CFF" />
    <circle cx="145" cy="76" r="4" fill="#B8A4FF" />
    <circle cx="-35" cy="187" r="3" fill="#9568F9" />
    <circle
      r="116"
      fill="#070D20"
      fill-opacity="0.72"
      stroke="#B8A4FF"
      stroke-opacity="0.2"
      stroke-width="1"
    />
    <text
      x="0"
      y="52"
      fill="url(#accent)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="148"
      font-weight="700"
      letter-spacing="-12"
      text-anchor="middle"
    >
      MP
    </text>
    <path
      d="M-45 76 H45"
      stroke="url(#accent)"
      stroke-opacity="0.85"
      stroke-width="3"
      stroke-linecap="round"
    />
    <circle r="7" fill="#B8A4FF" fill-opacity="0.9" />
  </g>

  <path d="M88 574 H1112" stroke="#B8A4FF" stroke-opacity="0.16" stroke-width="1" />
  <rect x="88" y="573" width="132" height="2" rx="1" fill="url(#accent)" />
</svg>
