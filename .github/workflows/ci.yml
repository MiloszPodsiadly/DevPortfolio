name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Report pinned runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Build static pages
        run: npm run build

      - name: Verify static output
        run: npm run verify:output

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Report pinned Node runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Report installed Playwright package
        run: npx playwright --version

      - name: Build static pages
        run: npm run build

      - name: Verify static output
        run: npm run verify:output

      - name: Run browser and accessibility tests
        id: browser_tests
        run: npm run test:e2e

      - name: Upload Playwright reports after browser test failure
        if: failure() && steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-e2e-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
