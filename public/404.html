<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0613" />
    <title>Page not found — Junior Software Developer</title>
    <meta
      name="description"
      content="The requested page could not be found. Choose a portfolio language."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0b0613;
        color: #faf7ff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(42rem, calc(100% - 2rem));
      }
      a {
        color: #fbcfe8;
        margin-right: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="not-found" id="main-content">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <nav aria-label="Choose a language">
        <a href="/en/">English portfolio</a>
        <a href="/pl/">Polskie portfolio</a>
      </nav>
    </main>
  </body>
</html>
